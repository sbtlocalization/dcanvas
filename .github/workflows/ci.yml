name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The repository is two Go modules (see ADR-0012); a root ./... pattern
      # does not descend into the nested CLI module, so each is vetted and
      # tested explicitly. The committed go.work binds them for these commands.
      - name: go vet (library)
        run: go vet -C . ./...
      - name: go test (library)
        run: go test -C . ./...
      - name: go vet (cli)
        run: go vet -C cmd/dcanvas ./...
      - name: go test (cli)
        run: go test -C cmd/dcanvas ./...
